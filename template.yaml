AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Secure serverless file upload. Mobile app gets a short-lived presigned S3 URL
  from Lambda (control path) and uploads the file straight to S3 (data path).

Parameters:
  ProjectName:
    Type: String
    Default: secure-upload
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,24}$'
    Description: Lowercase prefix used in the S3 bucket name.
  Stage:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9]{2,10}$'
  MaxFileSizeMB:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 500
  AllowedContentTypes:
    Type: String
    Default: 'image/*,application/pdf,text/plain'
    Description: Comma separated list. Wildcards such as image/* are allowed.
  UrlExpirySeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 3600
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional. Email address that receives CloudWatch alarm notifications.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        BUCKET_NAME: !Sub '${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}'
        TABLE_NAME: !Ref FilesTable
        MAX_FILE_SIZE_BYTES: !Sub '${MaxFileSizeMB}000000'
        ALLOWED_CONTENT_TYPES: !Ref AllowedContentTypes
        URL_EXPIRY_SECONDS: !Ref UrlExpirySeconds
        LOG_LEVEL: INFO

Resources:
  # ---------------------------------------------------------------- Identity
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Stage}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${Stage}-mobile'
      UserPoolId: !Ref UserPool
      GenerateSecret: false          # mobile apps cannot keep a secret
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ----------------------------------------------------------------- Storage
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:               # only needed for Expo Web / browser testing
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  UploadBucketTlsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}'
              - !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  FilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: fileId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: fileId
          KeyType: RANGE
      TimeToLiveSpecification:         # abandoned PENDING / REJECTED rows clean themselves up
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # --------------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  # --------------------------------------------------------------- Functions
  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: presign.handler
      Description: Validates the request and returns a short-lived presigned PUT URL.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}/uploads/*'
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FilesTable.Arn
      Events:
        Presign:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /uploads/presigned-url
            Method: POST

  ListFilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: list_files.handler
      Description: Lists the calling user's files (newest first).
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FilesTable
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /files
            Method: GET

  DownloadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: download_url.handler
      Description: Returns a short-lived presigned GET URL for one of the user's files.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}/uploads/*'
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt FilesTable.Arn
      Events:
        Download:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /files/{fileId}/download-url
            Method: GET

  DeleteFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: delete_file.handler
      Description: Deletes a file from S3 and its metadata from DynamoDB.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}/uploads/*'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:DeleteItem]
              Resource: !GetAtt FilesTable.Arn
      Events:
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /files/{fileId}
            Method: DELETE

  ProcessUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: process_upload.handler
      Description: Triggered by S3 ObjectCreated. Verifies the object and marks it UPLOADED or REJECTED.
      Timeout: 30
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}/uploads/*'
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt FilesTable.Arn
      Events:
        ObjectCreated:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  # ----------------------------------------------------------- Observability
  AlertsTopic:
    Type: AWS::SNS::Topic

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  PhotoUploadedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Stage}-photo-uploaded'
      AlarmDescription: A photo was uploaded to S3 and passed verification.
      Namespace: SecureUpload
      MetricName: PhotosUploaded
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  PresignErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Presign Lambda is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PresignFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  ProcessUploadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Post-upload verification Lambda is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ProcessUploadFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway is returning 5xx responses
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  ApiUrl:
    Description: Base URL for the mobile app (EXPO_PUBLIC_API_URL)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  Region:
    Description: AWS region (EXPO_PUBLIC_COGNITO_REGION)
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: App client id (EXPO_PUBLIC_COGNITO_CLIENT_ID)
    Value: !Ref UserPoolClient
  BucketName:
    Value: !Sub '${ProjectName}-${Stage}-${AWS::AccountId}-${AWS::Region}'
  TableName:
    Value: !Ref FilesTable
